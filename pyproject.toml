[project]
name = "openevolve-experiment-workflow"
version = "0.2.0"
description = "Mathematical candidate evolution with exact checks and optional OpenEvolve model proposals"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["openevolve==0.4.0", "orjson>=3.10,<4"]
test = ["openevolve==0.4.0", "orjson>=3.10,<4", "sympy>=1.14,<2", "networkx>=3.4,<4", "PyYAML>=6,<7", "python-frontmatter>=1.1,<2", "markdown-it-py>=4,<5", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
