max_iterations: 10
checkpoint_interval: 5
log_level: INFO
random_seed: 42
language: python
file_suffix: .py

llm:
  api_base: "https://chat.ecnu.edu.cn/open/api/v1"
  api_key: "${LLM_API_KEY}"
  primary_model: "ecnu-plus"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 4096
  timeout: 60
  retries: 3
  retry_delay: 5

database:
  in_memory: true
  population_size: 60
  archive_size: 20
  num_islands: 2
  feature_dimensions:
    - candidate_convergence_rate
    - candidate_mean_iterations
  feature_bins: 6
  random_seed: 42

evaluator:
  timeout: 180
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false

early_stopping_metric: combined_score
early_stopping_patience: 8
convergence_threshold: 0.001
max_code_length: 12000
